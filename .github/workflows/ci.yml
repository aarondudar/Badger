name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sast/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Matches the Dockerfile's base image (current LTS)
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: sast/backend/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Build only; images are not pushed (deploys are manual, Milestone 3)
      - run: docker build -t badger-backend:ci sast/backend
